name: MLOps CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  test-and-train:

    name: Train Model and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Train Model
        run: |
          python retrain.py

      - name: Validate Model
        run: |
          python validate_model.py

      - name: Run Tests
        run: |
          pytest -v

      - name: Upload Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.pkl
