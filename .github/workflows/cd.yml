name: MLOps CD

on:
  workflow_run:
    workflows: ["MLOps CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Locally
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout the exact commit that passed CI
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Install Dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # --------------------------------------------------
      # 4. Build Docker Image
      # --------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t iris-mlops-api:latest \
            .

      # --------------------------------------------------
      # 5. Deploy Container on GitHub Runner
      # --------------------------------------------------
      - name: Deploy Container
        run: |
          docker stop iris-api || true
          docker rm iris-api || true

          docker run -d \
            --name iris-api \
            -p 8000:8000 \
            iris-mlops-api:latest

      # --------------------------------------------------
      # 6. Wait for Container to Start
      # --------------------------------------------------
      - name: Wait for Application
        run: |
          echo "Waiting for Iris API..."

          for i in {1..15}; do
