name: MLOps CD

on:
  workflow_run:
    workflows:
      - MLOps CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Scan and Deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout exact commit that passed CI
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ============================================================
      # 2. Setup Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # 3. Install Python dependencies
      # ============================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # ============================================================
      # 4. Prepare temporary security report directories
      # ============================================================
      - name: Prepare Security Report Directories
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          mkdir -p "$RUNNER_TEMP/zap"

          chmod 777 "$RUNNER_TEMP/trivy"
          chmod 777 "$RUNNER_TEMP/zap"

          echo "TRIVY_DIR=$RUNNER_TEMP/trivy" >> "$GITHUB_ENV"
          echo "ZAP_DIR=$RUNNER_TEMP/zap" >> "$GITHUB_ENV"

          echo "===== SECURITY DIRECTORIES ====="
          ls -ld "$RUNNER_TEMP/trivy"
          ls -ld "$RUNNER_TEMP/zap"

      # ============================================================
      # 5. Build Docker image
      # ============================================================
      - name: Build Docker Image
        run: |
          echo "===== BUILDING DOCKER IMAGE ====="

          docker build \
            --tag iris-mlops-api:latest \
            .

          echo "===== DOCKER IMAGE ====="
          docker image inspect iris-mlops-api:latest
          docker images iris-mlops-api:latest

      # ============================================================
      # 6. Export Docker image for Trivy
      # ============================================================
      - name: Export Docker Image
        run: |
          echo "===== EXPORTING DOCKER IMAGE ====="

          docker save \
            -o "$TRIVY_DIR/iris-mlops-api.tar" \
            iris-mlops-api:latest

          echo "===== IMAGE ARCHIVE ====="
          ls -lh "$TRIVY_DIR/iris-mlops-api.tar"

      # ============================================================
      # 7. Trivy vulnerability scan
      #    Trivy runs inside a temporary Docker container.
      # ============================================================
      - name: Trivy Image Scan
        run: |
          echo "===== STARTING TRIVY ====="

          docker run --rm \
            -v "$TRIVY_DIR:/scan:ro" \
            aquasec/trivy:latest \
            image \
            --input /scan/iris-mlops-api.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table

          echo "===== TRIVY SCAN COMPLETED ====="

      # ============================================================
      # 8. Generate Trivy JSON report
      # ============================================================
      - name: Generate Trivy JSON Report
        if: always()
        run: |
          echo "===== GENERATING TRIVY JSON REPORT ====="

          docker run --rm \
            -v "$TRIVY_DIR:/scan:rw" \
            aquasec/trivy:latest \
            image \
            --input /scan/iris-mlops-api.tar \
            --scanners vuln \
            --format json \
            --output /scan/iris-mlops-api.json

          echo "===== TRIVY REPORT ====="
          ls -lah "$TRIVY_DIR"

      # ============================================================
      # 9. Upload Trivy report
      # ============================================================
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-image-report
          path: ${{ runner.temp }}/trivy/iris-mlops-api.json
          if-no-files-found: warn

      # ============================================================
      # 10. Remove temporary Trivy image archive
      # ============================================================
      - name: Remove Trivy Image Archive
        if: always()
        run: |
          rm -f "$TRIVY_DIR/iris-mlops-api.tar"

          echo "Temporary Trivy image archive removed."

      # ============================================================
      # 11. Create application Docker network
      # ============================================================
      - name: Create Application Network
        run: |
          echo "===== CREATING APPLICATION NETWORK ====="

          docker network rm iris-test-network 2>/dev/null || true

          docker network create iris-test-network

          echo "===== APPLICATION NETWORK ====="
          docker network inspect iris-test-network

      # ============================================================
      # 12. Start Iris API container
      # ============================================================
      - name: Deploy Container
        run: |
          echo "===== STARTING IRIS API ====="

          docker stop iris-api 2>/dev/null || true
          docker rm iris-api 2>/dev/null || true

          docker run -d \
            --name iris-api \
            --network iris-test-network \
            iris-mlops-api:latest

          echo "===== API CONTAINER ====="
          docker ps -a

      # ============================================================
      # 13. Wait for application
      # ============================================================
      - name: Wait for Application
        run: |
          echo "===== WAITING FOR IRIS API ====="

          for i in {1..20}; do

            if docker run --rm \
              --network iris-test-network \
              curlimages/curl:latest \
              --fail \
              --silent \
              http://iris-api:8000/health; then

              echo ""
              echo "Iris API is ready."
              exit 0
            fi

            echo "Attempt $i: API not ready."
            sleep 3

          done

          echo "ERROR: Iris API failed to start."

          echo "===== DOCKER CONTAINERS ====="
          docker ps -a

          echo "===== API LOGS ====="
          docker logs iris-api || true

          exit 1

      # ============================================================
      # 14. Health check
      # ============================================================
      - name: Health Check
        run: |
          echo "===== HEALTH CHECK ====="

          response=$(docker run --rm \
            --network iris-test-network \
            curlimages/curl:latest \
            --fail \
            --silent \
            http://iris-api:8000/health)

          echo "$response"

          echo "$response" | grep -q '"status":"healthy"'
          echo "$response" | grep -q '"model_loaded":true'

          echo "Health check passed."

      # ============================================================
      # 15. Prediction API test
      # ============================================================
      - name: Prediction API Check
        run: |
          echo "===== PREDICTION API TEST ====="

          response=$(docker run --rm \
            --network iris-test-network \
            curlimages/curl:latest \
            --fail \
            --silent \
            -X POST \
            http://iris-api:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[5.1,3.5,1.4,0.2]}')

          echo "$response"

          echo "$response" | grep -q '"model_version":"1.0.0"'

          echo "Prediction test passed."

      # ============================================================
      # 16. OWASP ZAP baseline DAST
      #
      #     A dedicated network is created for ZAP.
      #     iris-api is connected to that network.
      # ============================================================
      - name: OWASP ZAP Baseline Scan
        if: always()
        continue-on-error: true
        run: |
          echo "===== PREPARING ZAP ====="

          # --------------------------------------------------------
          # Verify API container exists
          # --------------------------------------------------------
          if ! docker ps -a --format '{{.Names}}' | grep -q '^iris-api$'; then
            echo "ERROR: iris-api container does not exist."
            docker ps -a
            exit 1
          fi

          # --------------------------------------------------------
          # Verify API container is running
          # --------------------------------------------------------
          if ! docker ps --format '{{.Names}}' | grep -q '^iris-api$'; then
            echo "API container is not running."
            echo "Starting iris-api..."

            docker start iris-api
          fi

          # --------------------------------------------------------
          # Remove any stale ZAP network
          # --------------------------------------------------------
          docker network rm zap-test-network 2>/dev/null || true

          # --------------------------------------------------------
          # Create dedicated ZAP network
          # --------------------------------------------------------
          docker network create zap-test-network

          echo "===== ZAP NETWORK ====="
          docker network inspect zap-test-network

          # --------------------------------------------------------
          # Connect API to ZAP network
          # --------------------------------------------------------
          echo "===== CONNECTING API TO ZAP NETWORK ====="

          docker network connect \
            zap-test-network \
            iris-api 2>/dev/null || true

          echo "===== NETWORK MEMBERS ====="
          docker network inspect zap-test-network

          # --------------------------------------------------------
          # Verify API from ZAP network
          # --------------------------------------------------------
          echo "===== TESTING API FROM ZAP NETWORK ====="

          docker run --rm \
            --network zap-test-network \
            curlimages/curl:latest \
            --fail \
            --silent \
            http://iris-api:8000/health

          echo ""
          echo "API is accessible from ZAP network."

          # --------------------------------------------------------
          # Prepare writable ZAP directory
          # --------------------------------------------------------
          mkdir -p "$ZAP_DIR"
          chmod 777 "$ZAP_DIR"

          echo "===== ZAP REPORT DIRECTORY ====="
          ls -ld "$ZAP_DIR"

          # --------------------------------------------------------
          # Run ZAP
          # --------------------------------------------------------
          echo "===== STARTING OWASP ZAP ====="

          docker run --rm \
            --network zap-test-network \
            -v "$ZAP_DIR:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://iris-api:8000 \
            -r /zap/wrk/zap-report.html \
            -J /zap/wrk/zap-report.json \
            -I

          echo "===== ZAP REPORTS ====="
          ls -lah "$ZAP_DIR"

      # ============================================================
      # 17. Upload ZAP reports
      # ============================================================
      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-baseline-report
          path: |
            ${{ runner.temp }}/zap/zap-report.html
            ${{ runner.temp }}/zap/zap-report.json
          if-no-files-found: warn

      # ============================================================
      # 18. Show containers, networks and application logs
      # ============================================================
      - name: Container Status and Logs
        if: always()
        run: |
          echo "===== DOCKER CONTAINERS ====="
          docker ps -a

          echo ""
          echo "===== APPLICATION NETWORK ====="
          docker network inspect iris-test-network || true

          echo ""
          echo "===== ZAP NETWORK ====="
          docker network inspect zap-test-network || true

          echo ""
          echo "===== APPLICATION LOGS ====="
          docker logs iris-api 2>/dev/null || true

          echo ""
          echo "===== ZAP REPORT DIRECTORY ====="
          ls -lah "$ZAP_DIR" 2>/dev/null || true

      # ============================================================
      # 19. Final cleanup
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          echo "===== FINAL CLEANUP ====="

          # Stop and remove application container
          docker stop iris-api 2>/dev/null || true
          docker rm iris-api 2>/dev/null || true

          # Remove networks
          docker network rm zap-test-network 2>/dev/null || true
          docker network rm iris-test-network 2>/dev/null || true

          # Remove temporary security directories
          rm -rf "$TRIVY_DIR" "$ZAP_DIR" 2>/dev/null || true

          echo "Cleanup completed."
