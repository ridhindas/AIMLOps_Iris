name: MLOps CD

on:
workflow_run:
workflows: ["MLOps CI"]
types:
- completed

permissions:
contents: read

jobs:
deploy:
name: Build, Scan and Deploy
if: ${{ github.event.workflow_run.conclusion == 'success' }}
runs-on: ubuntu-latest

```
steps:

  # --------------------------------------------------
  # 1. Checkout the exact commit that passed CI
  # --------------------------------------------------
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      ref: ${{ github.event.workflow_run.head_sha }}

  # --------------------------------------------------
  # 2. Python environment
  # --------------------------------------------------
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install -r requirements-dev.txt

  # --------------------------------------------------
  # 3. Build Docker image
  # --------------------------------------------------
  - name: Build Docker Image
    run: |
      docker build \
        -t iris-mlops-api:latest \
        .

  # --------------------------------------------------
  # 4. Verify Docker image
  # --------------------------------------------------
  - name: Verify Docker Image
    run: |
      docker images iris-mlops-api:latest

  # --------------------------------------------------
  # 5. Trivy Image Scan
  #    Trivy runs as a temporary Docker container.
  #    --rm automatically removes the Trivy container.
  # --------------------------------------------------
  - name: Trivy Image Scan
    run: |
      mkdir -p security/trivy

      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy:latest \
        image \
        --severity HIGH,CRITICAL \
        --exit-code 0 \
        --format table \
        iris-mlops-api:latest

  # --------------------------------------------------
  # 6. Generate Trivy JSON report
  # --------------------------------------------------
  - name: Generate Trivy JSON Report
    if: always()
    run: |
      mkdir -p security/trivy

      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "${{ github.workspace }}/security/trivy:/reports" \
        aquasec/trivy:latest \
        image \
        --format json \
        --output /reports/iris-mlops-api.json \
        iris-mlops-api:latest

  # --------------------------------------------------
  # 7. Upload Trivy report
  # --------------------------------------------------
  - name: Upload Trivy Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: trivy-image-report
      path: security/trivy/iris-mlops-api.json

  # --------------------------------------------------
  # 8. Deploy application container
  # --------------------------------------------------
  - name: Deploy Container
    run: |
      docker stop iris-api || true
      docker rm iris-api || true

      docker run -d \
        --name iris-api \
        -p 8000:8000 \
        iris-mlops-api:latest

  # --------------------------------------------------
  # 9. Wait for application
  # --------------------------------------------------
  - name: Wait for Application
    run: |
      echo "Waiting for Iris API..."

      for i in {1..15}; do

        if curl -fs http://127.0.0.1:8000/health; then
          echo ""
          echo "Iris API is ready."
          exit 0
        fi

        echo "Attempt $i: API not ready yet..."
        sleep 3

      done

      echo "Iris API failed to start."

      docker ps -a
      docker logs iris-api

      exit 1

  # --------------------------------------------------
  # 10. Health check
  # --------------------------------------------------
  - name: Health Check
    run: |
      echo "Checking /health..."

      response=$(curl -fs \
        http://127.0.0.1:8000/health)

      echo "Health response:"
      echo "$response"

      echo "$response" | grep -q '"status":"healthy"'
      echo "$response" | grep -q '"model_loaded":true'

      echo "Health check passed."

  # --------------------------------------------------
  # 11. Prediction API test
  # --------------------------------------------------
  - name: Prediction API Check
    run: |
      echo "Testing /predict..."

      response=$(curl -fs \
        -X POST \
        http://127.0.0.1:8000/predict \
        -H "Content-Type: application/json" \
        -d '{"features":[5.1,3.5,1.4,0.2]}')

      echo "Prediction response:"
      echo "$response"

      echo "$response" | grep -q '"model_version":"1.0.0"'

      echo "Prediction check passed."

  # --------------------------------------------------
  # 12. OWASP ZAP baseline scan
  #     ZAP also runs as a temporary Docker container.
  # --------------------------------------------------
  - name: OWASP ZAP Baseline Scan
    run: |
      mkdir -p security/zap

      docker run --rm \
        --network host \
        -v "${{ github.workspace }}/security/zap:/zap/wrk/:rw" \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-baseline.py \
        -t http://127.0.0.1:8000 \
        -r zap-report.html \
        -J zap-report.json \
        -I

  # --------------------------------------------------
  # 13. Upload ZAP reports
  # --------------------------------------------------
  - name: Upload ZAP Reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: zap-baseline-report
      path: |
        security/zap/zap-report.html
        security/zap/zap-report.json

  # --------------------------------------------------
  # 14. Show container status/logs
  # --------------------------------------------------
  - name: Container Status
    if: always()
    run: |
      echo "Container status:"
      docker ps -a

      echo ""
      echo "Container logs:"
      docker logs iris-api || true

  # --------------------------------------------------
  # 15. Cleanup application container
  # --------------------------------------------------
  - name: Cleanup Container
    if: always()
    run: |
      echo "Cleaning up deployment..."

      docker stop iris-api || true
      docker rm iris-api || true

      echo "Cleanup completed."
```

