name: MLOps CD

on:
  workflow_run:
    workflows:
      - MLOps CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Scan and Deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build Docker Image
        run: |
          docker build \
            --tag iris-mlops-api:latest \
            .

      - name: Verify Docker Image
        run: |
          docker image inspect iris-mlops-api:latest
          docker images iris-mlops-api:latest

      - name: Trivy Image Scan
        run: |
          mkdir -p security/trivy

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            iris-mlops-api:latest

      - name: Generate Trivy JSON Report
        if: always()
        run: |
          mkdir -p security/trivy

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/security/trivy:/reports" \
            aquasec/trivy:latest \
            image \
            --format json \
            --output /reports/iris-mlops-api.json \
            iris-mlops-api:latest

          ls -lah security/trivy/

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: security/trivy/iris-mlops-api.json
          if-no-files-found: warn

      - name: Deploy Container
        run: |
          docker stop iris-api 2>/dev/null || true
          docker rm iris-api 2>/dev/null || true

          docker run -d \
            --name iris-api \
            -p 8000:8000 \
            iris-mlops-api:latest

      - name: Wait for Application
        run: |
          echo "Waiting for Iris API..."

          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo ""
              echo "Iris API is ready."
              exit 0
            fi

            echo "Attempt $i: API not ready."
            sleep 3
          done

          echo "ERROR: Iris API failed to start."
          docker ps -a
          docker logs iris-api || true
          exit 1

      - name: Health Check
        run: |
          response=$(curl --fail --silent http://127.0.0.1:8000/health)

          echo "$response"

          echo "$response" | grep -q '"status":"healthy"'
          echo "$response" | grep -q '"model_loaded":true'

          echo "Health check passed."

      - name: Prediction API Check
        run: |
          response=$(curl --fail --silent \
            -X POST \
            http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[5.1,3.5,1.4,0.2]}')

          echo "$response"

          echo "$response" | grep -q '"model_version":"1.0.0"'

          echo "Prediction test passed."

      - name: OWASP ZAP Baseline Scan
        if: always()
        run: |
          mkdir -p security/zap

          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/security/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -r /zap/wrk/zap-report.html \
            -J /zap/wrk/zap-report.json \
            -I

          ls -lah security/zap/

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            security/zap/zap-report.html
            security/zap/zap-report.json
          if-no-files-found: warn

      - name: Container Status
        if: always()
        run: |
          docker ps -a
          echo "===== APPLICATION LOGS ====="
          docker logs iris-api || true

      - name: Cleanup Application Container
        if: always()
        run: |
          docker stop iris-api 2>/dev/null || true
          docker rm iris-api 2>/dev/null || true
