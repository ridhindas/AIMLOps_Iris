name: MLOps CD

on:
  workflow_run:
    workflows:
      - MLOps CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Scan and Deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout exact commit that passed CI
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ============================================================
      # 2. Setup Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # ============================================================
      # 4. Create temporary security-report directories
      # ============================================================
      - name: Prepare Security Report Directories
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          mkdir -p "$RUNNER_TEMP/zap"

          chmod 777 "$RUNNER_TEMP/trivy"
          chmod 777 "$RUNNER_TEMP/zap"

          echo "TRIVY_DIR=$RUNNER_TEMP/trivy" >> "$GITHUB_ENV"
          echo "ZAP_DIR=$RUNNER_TEMP/zap" >> "$GITHUB_ENV"

          echo "===== SECURITY DIRECTORIES ====="
          ls -ld "$RUNNER_TEMP/trivy"
          ls -ld "$RUNNER_TEMP/zap"

      # ============================================================
      # 5. Build Docker image
      # ============================================================
      - name: Build Docker Image
        run: |
          docker build \
            --tag iris-mlops-api:latest \
            .

          echo "===== DOCKER IMAGE ====="
          docker image inspect iris-mlops-api:latest
          docker images iris-mlops-api:latest

      # ============================================================
      # 6. Export Docker image
      # ============================================================
      - name: Export Docker Image
        run: |
          docker save \
            -o "$TRIVY_DIR/iris-mlops-api.tar" \
            iris-mlops-api:latest

          echo "===== IMAGE ARCHIVE ====="
          ls -lh "$TRIVY_DIR/iris-mlops-api.tar"

      # ============================================================
      # 7. Trivy image vulnerability scan
      # ============================================================
      - name: Trivy Image Scan
        run: |
          echo "===== STARTING TRIVY ====="

          docker run --rm \
            -v "$TRIVY_DIR:/scan:ro" \
            aquasec/trivy:latest \
            image \
            --input /scan/iris-mlops-api.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table

          echo "===== TRIVY SCAN COMPLETED ====="

      # ============================================================
      # 8. Generate Trivy JSON report
      # ============================================================
      - name: Generate Trivy JSON Report
        if: always()
        run: |
          echo "===== GENERATING TRIVY JSON ====="

          docker run --rm \
            -v "$TRIVY_DIR:/scan:rw" \
            aquasec/trivy:latest \
            image \
            --input /scan/iris-mlops-api.tar \
            --scanners vuln \
            --format json \
            --output /scan/iris-mlops-api.json

          echo "===== TRIVY REPORT ====="
          ls -lah "$TRIVY_DIR"

      # ============================================================
      # 9. Upload Trivy report
      # ============================================================
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-image-report
          path: ${{ runner.temp }}/trivy/iris-mlops-api.json
          if-no-files-found: warn

      # ============================================================
      # 10. Remove temporary Trivy image
      # ============================================================
      - name: Remove Trivy Image Archive
        if: always()
        run: |
          rm -f "$TRIVY_DIR/iris-mlops-api.tar"

          echo "Temporary image archive removed."

      # ============================================================
      # 11. Create Docker network
      # ============================================================
      - name: Create Test Network
        run: |
          docker network rm iris-test-network 2>/dev/null || true

          docker network create iris-test-network

          echo "===== DOCKER NETWORK ====="
          docker network inspect iris-test-network

      # ============================================================
      # 12. Start Iris API
      # ============================================================
      - name: Deploy Container
        run: |
          docker stop iris-api 2>/dev/null || true
          docker rm iris-api 2>/dev/null || true

          docker run -d \
            --name iris-api \
            --network iris-test-network \
            iris-mlops-api:latest

          echo "===== API CONTAINER ====="
          docker ps -a

      # ============================================================
      # 13. Wait for application
      # ============================================================
      - name: Wait for Application
        run: |
          echo "Waiting for Iris API..."

          for i in {1..20}; do

            if docker run --rm \
              --network iris-test-network \
              curlimages/curl:latest \
              --fail \
              --silent \
              http://iris-api:8000/health; then

              echo ""
              echo "Iris API is ready."
              exit 0
            fi

            echo "Attempt $i: API not ready."
            sleep 3

          done

          echo "ERROR: Iris API failed to start."

          echo "===== CONTAINERS ====="
          docker ps -a

          echo "===== API LOGS ====="
          docker logs iris-api || true

          exit 1

      # ============================================================
      # 14. Health check
      # ============================================================
      - name: Health Check
        run: |
          response=$(docker run --rm \
            --network iris-test-network \
            curlimages/curl:latest \
            --fail \
            --silent \
            http://iris-api:8000/health)

          echo "$response"

          echo "$response" | grep -q '"status":"healthy"'
          echo "$response" | grep -q '"model_loaded":true'

          echo "Health check passed."

      # ============================================================
      # 15. Prediction API test
      # ============================================================
      - name: Prediction API Check
        run: |
          response=$(docker run --rm \
            --network iris-test-network \
            curlimages/curl:latest \
            --fail \
            --silent \
            -X POST \
            http://iris-api:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[5.1,3.5,1.4,0.2]}')

          echo "$response"

          echo "$response" | grep -q '"model_version":"1.0.0"'

          echo "Prediction test passed."

      # ============================================================
      # 16. OWASP ZAP baseline DAST
      # ============================================================
      - name: OWASP ZAP Baseline Scan
        if: always()
        continue-on-error: true
        run: |
          echo "===== CHECKING NETWORK ====="
          docker network inspect iris-test-network

          echo "===== CHECKING API ====="
          docker ps -a

          echo "===== API HEALTH ====="

          docker run --rm \
            --network iris-test-network \
            curlimages/curl:latest \
            --fail \
            --silent \
            http://iris-api:8000/health

          echo ""

          echo "===== STARTING OWASP ZAP ====="

          docker run --rm \
            --network iris-test-network \
            -v "$ZAP_DIR:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://iris-api:8000 \
            -r /zap/wrk/zap-report.html \
            -J /zap/wrk/zap-report.json \
            -I

          echo "===== ZAP REPORTS ====="
          ls -lah "$ZAP_DIR"

      # ============================================================
      # 17. Upload ZAP reports
      # ============================================================
      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-baseline-report
          path: |
            ${{ runner.temp }}/zap/zap-report.html
            ${{ runner.temp }}/zap/zap-report.json
          if-no-files-found: warn

      # ============================================================
      # 18. Container status and logs
      # ============================================================
      - name: Container Status and Logs
        if: always()
        run: |
          echo "===== DOCKER CONTAINERS ====="
          docker ps -a

          echo ""
          echo "===== DOCKER NETWORK ====="
          docker network inspect iris-test-network || true

          echo ""
          echo "===== APPLICATION LOGS ====="
          docker logs iris-api 2>/dev/null || true

      # ============================================================
      # 19. Cleanup
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          echo "===== CLEANUP ====="

          docker stop iris-api 2>/dev/null || true
          docker rm iris-api 2>/dev/null || true

          docker network rm iris-test-network 2>/dev/null || true

          rm -rf "$TRIVY_DIR" "$ZAP_DIR" 2>/dev/null || true

          echo "Cleanup completed."
