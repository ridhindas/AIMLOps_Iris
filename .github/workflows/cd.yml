name: MLOps CD

on:
  workflow_run:
    workflows:
      - MLOps CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Scan and Deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout the exact commit that passed CI
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ============================================================
      # 2. Setup Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # 3. Install Python dependencies
      # ============================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # ============================================================
      # 4. Build Docker image
      # ============================================================
      - name: Build Docker Image
        run: |
          docker build \
            --tag iris-mlops-api:latest \
            .

      # ============================================================
      # 5. Verify Docker image
      # ============================================================
      - name: Verify Docker Image
        run: |
          docker image inspect iris-mlops-api:latest
          docker images iris-mlops-api:latest

      # ============================================================
      # 6. Trivy image security scan
      #    Trivy container is automatically removed with --rm
      # ============================================================
      - name: Trivy Image Scan
        run: |
          mkdir -p security/trivy

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            iris-mlops-api:latest

      # ============================================================
      # 7. Generate Trivy JSON report
      # ============================================================
      - name: Generate Trivy JSON Report
        if: always()
        run: |
          mkdir -p security/trivy

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/security/trivy:/reports" \
            aquasec/trivy:latest \
            image \
            --format json \
            --output /reports/iris-mlops-api.json \
            iris-mlops-api:latest

          echo "===== TRIVY REPORT ====="
          ls -lah security/trivy/

      # ============================================================
      # 8. Upload Trivy report
      # ============================================================
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: security/trivy/iris-mlops-api.json
          if-no-files-found: warn

      # ============================================================
      # 9. Create Docker network
      # ============================================================
      - name: Create Test Network
        run: |
          docker network rm iris-test-network 2>/dev/null || true
          docker network create iris-test-network

          echo "===== DOCKER NETWORK ====="
          docker network inspect iris-test-network

      # ============================================================
      # 10. Start Iris API container
      # ============================================================
      - name: Deploy Container
        run: |
          docker stop iris-api 2>/dev/null || true
          docker rm iris-api 2>/dev/null || true

          docker run -d \
            --name iris-api \
            --network iris-test-network \
            iris-mlops-api:latest

          echo "===== API CONTAINER ====="
          docker ps -a

      # ============================================================
      # 11. Wait for API
      # ============================================================
      - name: Wait for Application
        run: |
          echo "Waiting for Iris API..."

          for i in {1..20}; do

            if docker run --rm \
              --network iris-test-network \
              curlimages/curl:latest \
              --fail \
              --silent \
              http://iris-api:8000/health; then

              echo ""
              echo "Iris API is ready."
              exit 0
            fi

            echo "Attempt $i: API not ready."
            sleep 3

          done

          echo "ERROR: Iris API failed to start."

          echo "===== DOCKER CONTAINERS ====="
          docker ps -a

          echo "===== API LOGS ====="
          docker logs iris-api || true

          exit 1

      # ============================================================
      # 12. Health check
      # ============================================================
      - name: Health Check
        run: |
          echo "Checking /health..."

          response=$(docker run --rm \
            --network iris-test-network \
            curlimages/curl:latest \
            --fail \
            --silent \
            http://iris-api:8000/health)

          echo "$response"

          echo "$response" | grep -q '"status":"healthy"'
          echo "$response" | grep -q '"model_loaded":true'

          echo "Health check passed."

      # ============================================================
      # 13. Prediction API test
      # ============================================================
      - name: Prediction API Check
        run: |
          echo "Testing /predict..."

          response=$(docker run --rm \
            --network iris-test-network \
            curlimages/curl:latest \
            --fail \
            --silent \
            -X POST \
            http://iris-api:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[5.1,3.5,1.4,0.2]}')

          echo "$response"

          echo "$response" | grep -q '"model_version":"1.0.0"'

          echo "Prediction test passed."

      # ============================================================
      # 14. OWASP ZAP baseline DAST scan
      #     ZAP and API are on the same Docker network
      # ============================================================
      - name: OWASP ZAP Baseline Scan
        if: always()
        run: |
          mkdir -p security/zap

          # Allow the ZAP container user to write reports
          chmod 777 security/zap

          echo "===== STARTING OWASP ZAP ====="

          docker run --rm \
            --network iris-test-network \
            -v "${{ github.workspace }}/security/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://iris-api:8000 \
            -r /zap/wrk/zap-report.html \
            -J /zap/wrk/zap-report.json \
            -I

          echo "===== ZAP REPORT FILES ====="
          ls -lah security/zap/

      # ============================================================
      # 15. Upload ZAP reports
      # ============================================================
      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            security/zap/zap-report.html
            security/zap/zap-report.json
          if-no-files-found: warn

      # ============================================================
      # 16. Show application status and logs
      # ============================================================
      - name: Container Status and Logs
        if: always()
        run: |
          echo "===== DOCKER CONTAINERS ====="
          docker ps -a

          echo ""
          echo "===== DOCKER NETWORK ====="
          docker network inspect iris-test-network || true

          echo ""
          echo "===== APPLICATION LOGS ====="
          docker logs iris-api 2>/dev/null || true

      # ============================================================
      # 17. Cleanup
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          echo "===== CLEANUP ====="

          docker stop iris-api 2>/dev/null || true
          docker rm iris-api 2>/dev/null || true

          docker network rm iris-test-network 2>/dev/null || true

          echo "Cleanup completed."
